[package]
name = "qwen3tts-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Qwen3-TTS inference, codec decoding, CLI and desktop GUI in Rust with Candle"
readme = "README.md"
license = "MIT"
repository = "https://github.com/stevenke1981/qwen3tts-rs"
keywords = ["text-to-speech", "tts", "qwen3", "candle", "rust"]
categories = ["multimedia::audio", "science"]

[features]
default = ["cpu", "candle-llm"]
stage-dump = ["dep:sha2"]
cuda = ["candle-core/cuda"]
metal = ["candle-core/metal"]
cpu = []
candle-llm = []
gui = ["dep:eframe", "dep:egui", "dep:rfd", "dep:rodio"]

[dependencies]
# Candle ML framework
candle-core = "0.10"
candle-nn = "0.10"
sha2 = { version = "0.10", optional = true }

# Parallelism
rayon = "1"

# Async runtime (I/O boundary only)
tokio = { version = "1", features = ["rt", "sync"] }

# Weight serialization & memory mapping
safetensors = "0.7"
memmap2 = "0.9"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Audio output
hound = "3"

# Logging
log = "0.4"

# HuggingFace tokenizer (pure-Rust BPE, used by the native talker backend)
tokenizers = "0.22"

# Optional desktop GUI and playback stack
eframe = { version = "0.31", optional = true }
egui = { version = "0.31", optional = true }
rfd = { version = "0.15", optional = true }
rodio = { version = "0.20", optional = true }

[dev-dependencies]
env_logger = "0.11"
criterion = { version = "0.5", features = ["html_reports"] }
sha2 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

[lib]
name = "qwen3tts"
path = "src/lib.rs"

[[example]]
name = "synthesize_batch"
required-features = ["candle-llm"]

[[example]]
name = "quantize_tokenizer"

[[example]]
name = "gguf_talker_probe"

[[bench]]
name = "bench_causal_conv"
harness = false

[[bench]]
name = "bench_codebook"
harness = false

[[bench]]
name = "bench_decoder_12hz"
harness = false

[[bin]]
name = "qwen3tts-rs"
path = "src/bin/qwen3tts-rs.rs"

[[bin]]
name = "qwen3tts-gui"
path = "src/bin/qwen3tts-gui.rs"
required-features = ["gui"]

[[bin]]
name = "convert-gguf"
path = "src/bin/convert_gguf.rs"

[patch.crates-io]
candle-kernels = { path = "patches/candle-kernels" }
