[package]
name = "qwen3tts-rs"
version = "0.1.17"
edition = "2024"
description = "Qwen3-TTS Codec Decode module - pure Rust/Candle rewrite"
license = "MIT"
repository = "https://github.com/steven/qwen3tts-rs"

[features]
default = ["cpu"]
stage-dump = ["sha2"]
cuda = ["candle-core/cuda"]
metal = ["candle-core/metal"]
cpu = []
candle-llm = []

[dependencies]
# Candle ML framework
candle-core = "0.10"
candle-nn = "0.10"
sha2 = { version = "0.10", optional = true }

# Parallelism
rayon = "1"

# Async runtime (I/O boundary only)
tokio = { version = "1", features = ["rt", "sync"] }

# Weight serialization
safetensors = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Audio output
hound = "3"

# Logging
log = "0.4"

# HuggingFace tokenizer (pure-Rust BPE, used by the native talker backend)
tokenizers = "0.22"

# GUI framework
eframe = { version = "0.31", features = ["default"] }
egui = "0.31"

# Native file dialogs
rfd = "0.15"

# Audio playback
rodio = "0.20"

[dev-dependencies]
env_logger = "0.11"
criterion = { version = "0.5", features = ["html_reports"] }
sha2 = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

[lib]
name = "qwen3tts"
path = "src/lib.rs"

[[example]]
name = "synthesize_batch"
required-features = ["candle-llm"]

[[example]]
name = "quantize_tokenizer"

[[example]]
name = "gguf_talker_probe"

[[bench]]
name = "bench_causal_conv"
harness = false

[[bench]]
name = "bench_codebook"
harness = false

[[bench]]
name = "bench_decoder_12hz"
harness = false

[[bin]]
name = "qwen3tts-gui"
path = "src/bin/qwen3tts-gui.rs"

[patch.crates-io]
candle-kernels = { path = "patches/candle-kernels" }
