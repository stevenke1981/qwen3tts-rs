name: CI

on:
  push:
    branches:
      - master
      - "feat/**"
      - "fix/**"
      - "review/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quality:
    name: Format, build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-quality-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-quality-
            ${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check library, binaries and examples
        run: cargo check --locked --lib --bins --examples

      - name: Clippy
        run: cargo clippy --locked --lib --bins --examples -- -D warnings

      - name: Run library tests
        run: cargo test --locked --lib

      - name: Compile integration tests
        run: cargo test --locked --tests --no-run

  minimal-core:
    name: Minimal core feature set
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-minimal-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-minimal-
            ${{ runner.os }}-

      - name: Check without default features
        run: cargo check --locked --no-default-features --lib

  gui-windows:
    name: Windows GUI feature
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gui-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gui-
            ${{ runner.os }}-

      - name: Check GUI binary
        run: cargo check --locked --no-default-features --features "cpu,candle-llm,gui" --bin qwen3tts-gui

      - name: Run GUI unit tests
        run: cargo test --locked --no-default-features --features "cpu,candle-llm,gui" --lib gui::tests
