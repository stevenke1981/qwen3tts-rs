name: CI

on:
  push:
    branches:
      - master
      - "feat/**"
      - "fix/**"
      - "review/**"
      - "codex/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-quality-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-quality-
            ${{ runner.os }}-

      # The repository still contains legacy formatting debt. Keep the gate
      # focused on maintained entry points until a dedicated format-only
      # change can be reviewed separately from model and numerical code.
      - name: Check maintained entry-point formatting
        run: >-
          rustfmt --edition 2024 --check
          build.rs
          src/bin/qwen3tts-rs.rs
          src/bin/qwen3tts-gui.rs
          tests/downloader_gui_test.rs

      - name: Check library, binaries and examples
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --locked --lib --bins --examples

      # Preserve visibility into existing lint debt without forcing risky
      # numerical/model refactors into unrelated packaging changes.
      - name: Clippy advisory baseline
        run: cargo clippy --locked --lib --bins --examples

      - name: Run library tests
        run: cargo test --locked --lib

      - name: Compile integration tests
        run: cargo test --locked --tests --no-run

  minimal-core:
    name: Minimal core feature set
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-minimal-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-minimal-
            ${{ runner.os }}-

      - name: Check without default features
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --locked --no-default-features --lib

  msrv:
    name: Rust 1.87 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-1.87-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-1.87-

      - name: Check minimal core on MSRV
        run: cargo check --locked --no-default-features --lib

  gui-windows:
    name: Windows GUI feature
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gui-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gui-
            ${{ runner.os }}-

      - name: Parse PowerShell build scripts
        shell: pwsh
        run: |
          [void][ScriptBlock]::Create((Get-Content -Raw build_all.ps1))
          [void][ScriptBlock]::Create((Get-Content -Raw build_release_cuda.ps1))

      - name: Verify CPU-only artifact selection
        shell: pwsh
        run: ./tests/build_cpu_only_test.ps1

      - name: Check GUI binary
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --locked --no-default-features --features "cpu,candle-llm,gui" --bin qwen3tts-gui

      - name: Compile GUI integration coverage
        run: >-
          cargo test --locked --no-default-features
          --features "cpu,candle-llm,gui"
          --test downloader_gui_test --no-run

      - name: Run GUI unit tests
        run: cargo test --locked --no-default-features --features "cpu,candle-llm,gui" --lib gui::tests
