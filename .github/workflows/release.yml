name: Release binaries

on:
  push:
    branches: [master, codex/automatic-releases]
    tags: ["v*"]
  pull_request:
    branches: [master]
  # Manual runs exercise the entire build/package path without publishing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }} CPU
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: cpu,candle-llm,gui
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: cpu,candle-llm
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Cache target build output
        uses: actions/cache@v4
        with:
          path: target
          key: release-target-${{ matrix.target }}-cpu-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs', 'patches/**', '.github/workflows/release.yml') }}-${{ github.sha }}
          restore-keys: |
            release-target-${{ matrix.target }}-cpu-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs', 'patches/**', '.github/workflows/release.yml') }}-

      - name: Run library tests
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_FEATURES: ${{ matrix.features }}
        run: |
          cargo test --locked --no-default-features --features $env:BUILD_FEATURES --target $env:BUILD_TARGET --lib
          if ($LASTEXITCODE -ne 0) { throw 'Library tests failed' }

      - name: Build release binaries
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_FEATURES: ${{ matrix.features }}
        run: |
          cargo build --release --locked --no-default-features --features $env:BUILD_FEATURES --target $env:BUILD_TARGET --bins
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }

      - name: Smoke-test CLI and package
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_FEATURES: ${{ matrix.features }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_id }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $binDir = Join-Path "target/$env:BUILD_TARGET" 'release'
          & (Join-Path $binDir "qwen3tts-rs$suffix") --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI --help smoke test failed' }
          & (Join-Path $binDir "convert-gguf$suffix") --help
          if ($LASTEXITCODE -ne 0) { throw 'Converter --help smoke test failed' }

          $package = "qwen3tts-rs-$env:BUILD_TARGET-cpu"
          $stage = Join-Path 'package' $package
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $binaries = @('qwen3tts-rs', 'convert-gguf')
          if ($IsWindows) { $binaries += 'qwen3tts-gui' }
          foreach ($name in $binaries) {
            $source = Join-Path $binDir "$name$suffix"
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) { throw "Missing binary: $source" }
            Copy-Item -LiteralPath $source -Destination $stage
          }
          Copy-Item -LiteralPath 'README.md', 'LICENSE', 'docs/automatic-releases.md' -Destination $stage
          $metadata = [ordered]@{
            commit = $env:BUILD_SHA
            target = $env:BUILD_TARGET
            features = $env:BUILD_FEATURES
            run_id = $env:BUILD_RUN
            run_attempt = $env:BUILD_ATTEMPT
            rustc = (rustc --version)
            validation = 'Library tests and CLI --help only; no model or numerical alignment certification.'
          }
          $metadata | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $stage 'build-info.json') -Encoding utf8
          if ($IsWindows) {
            $archive = "dist/$package.zip"
            Compress-Archive -Path $stage -DestinationPath $archive
          } else {
            $archive = "dist/$package.tar.gz"
            tar -czf $archive -C package $package
            if ($LASTEXITCODE -ne 0) { throw 'Archive creation failed' }
          }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    # Explicitly exclude PRs, manual builds, and forks from publication.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'stevenke1981/qwen3tts-rs' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all successful matrix packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify checksums and publish immutable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          BUILD_REF_NAME: ${{ github.ref_name }}
          BUILD_RUN: ${{ github.run_id }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @(
            'qwen3tts-rs-x86_64-pc-windows-msvc-cpu.zip',
            'qwen3tts-rs-x86_64-unknown-linux-gnu-cpu.tar.gz'
          )
          $assets = @()
          foreach ($name in $names) {
            $archive = Join-Path 'dist' $name
            $checksum = "$archive.sha256"
            $expected = (Get-Content -LiteralPath $checksum -Raw).Trim()
            $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -cne "$actual  $name") { throw "Checksum mismatch: $name" }
            $assets += $archive, $checksum
          }
          $preview = $env:BUILD_REF -eq 'refs/heads/master'
          if ($preview) {
            $tag = "preview-$($env:BUILD_SHA.Substring(0, 12))-$env:BUILD_RUN-$env:BUILD_ATTEMPT"
            $title = "CPU preview $($env:BUILD_SHA.Substring(0, 12))"
          } else {
            $tag = $env:BUILD_REF_NAME
            $title = $tag
          }
          $notes = @"
          CPU binaries for commit $env:BUILD_SHA.

          Windows: CLI, GUI and convert-gguf. Linux x86_64 (Ubuntu 22.04/glibc 2.35 or newer): CLI and convert-gguf.
          Model weights and CUDA support are not included. Library tests and CLI --help passed on both platforms. GUI interaction, speech quality, model alignment and performance gates are separate and are not certified by this build.

          Verify the archive using its accompanying SHA256 file. Build: https://github.com/$env:GH_REPO/actions/runs/$env:BUILD_RUN
          "@
          $arguments = @('release', 'create', $tag) + $assets + @('--target', $env:BUILD_SHA, '--title', $title, '--notes', $notes)
          if ($preview) { $arguments += '--prerelease', '--latest=false' }
          else { $arguments += '--verify-tag' }
          # No upload --clobber, release edit, tag force-update, or moving latest tag.
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed; existing releases are never overwritten' }
